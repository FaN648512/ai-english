name: 每日单词推送

on:
  schedule:
    # GitHub 的 cron 只认 UTC，且整点最拥堵（曾被延迟 4 小时）。
    # 这里在 06:17-21:17（北京）之间每小时探测一次，由代码判断当天是否已推。
    - cron: "17 0-13,22-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 忽略「今天已推送」限制，强制再推一批
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-word-pusher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --omit=dev --no-audit --no-fund

      - name: 推送单词卡片
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          PUSH_TIMEZONE: Asia/Shanghai
          SCHEDULER_ENABLED: "false"
        run: node src/push-once.js ${{ inputs.force && '--force' || '' }}

      - name: 提交轮次状态
        run: |
          if [[ -n "$(git status --porcelain data/db.json)" ]]; then
            git config user.name "daily-word-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/db.json
            git commit -m "chore: 更新推送轮次 [skip ci]"
            git push
          else
            echo "词库状态无变化"
          fi
