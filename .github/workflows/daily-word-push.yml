name: 每日单词推送

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00。GitHub 的 cron 只认 UTC，改时间要自己换算。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 忽略「今天已推送」限制，强制再推一批
        type: boolean
        default: false
  # 临时触发入口：Trae 的授权无 Actions 写权限，加一次 push 触发做联通验证，验证后会移除
  push:
    branches: [main]
    paths:
      - "daily-word-pusher/**"
      - ".github/workflows/daily-word-push.yml"

permissions:
  contents: write

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-word-pusher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --omit=dev --no-audit --no-fund

      - name: 推送单词卡片
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          PUSH_TIMEZONE: Asia/Shanghai
          SCHEDULER_ENABLED: "false"
        run: node src/push-once.js ${{ inputs.force && '--force' || '' }}

      - name: 提交轮次状态
        run: |
          if [[ -n "$(git status --porcelain data/db.json)" ]]; then
            git config user.name "daily-word-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/db.json
            git commit -m "chore: 更新推送轮次 [skip ci]"
            git push
          else
            echo "词库状态无变化"
          fi
